name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly: catch new Go/stdlib vulnerabilities even without commits
permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: Conventional Commits
        env:
          EVENT: ${{ github.event_name }}
          PR_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then .github/commits.sh "$PR_RANGE"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then .github/commits.sh "$BEFORE..$SHA"
          fi  # tag pushes: those commits were already checked on main

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version: 1.26.x, check-latest: true, cache: false}  # latest patch; no deps to cache
      - run: go vet ./... && go test -race ./...
      - name: govulncheck (Go stdlib + modules)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - uses: azure/setup-helm@v5
      - run: helm lint charts/orbitgate

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@v1
        with: {install_only: true}
      - uses: azure/setup-helm@v5
      - run: ./test/kind.sh

  # CVE + misconfiguration scanning; fails on fixable HIGH/CRITICAL. Also runs weekly (schedule).
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t orbitgate:scan .
      - name: Trivy image (CVEs in the binary and any OS packages)
        # SHA-pinned: trivy-action tags were hijacked in March 2026 (CVE-2026-33634); v0.35.0 is the clean, immutable release.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: orbitgate:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy config (Dockerfile + Helm chart with default values)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_HELM_KUBE_VERSION: "1.34.0"  # chart needs >=1.25; Trivy's renderer defaults to 1.20
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-setup-trivy: true

  # Dependabot minor/patch updates merge themselves once every check above passed; majors wait for review.
  automerge:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    needs: [commits, test, e2e, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash --delete-branch "$PR"

  # Tag vX.Y.Z -> image ghcr.io/reflexglobal/orbitgate:X.Y.Z + chart oci://ghcr.io/reflexglobal/charts/orbitgate X.Y.Z
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [commits, test, e2e, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write  # keyless cosign signing
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}  # tags + history for the changelog
      - run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: image
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/reflexglobal/orbitgate:${{ env.VERSION }}
          build-args: VERSION=${{ env.VERSION }}
          sbom: true              # SPDX SBOM attestation per platform
          provenance: mode=max    # SLSA provenance attestation
      - uses: azure/setup-helm@v5
      - uses: sigstore/cosign-installer@v3
      - uses: oras-project/setup-oras@v2
      - name: Prepare chart for ArtifactHub
        run: |
          sed -i "s#ghcr.io/reflexglobal/orbitgate:[0-9A-Za-z.-]*#ghcr.io/reflexglobal/orbitgate:$VERSION#" charts/orbitgate/Chart.yaml
          case "$VERSION" in *-*) PRE=true ;; *) PRE=false ;; esac
          echo "PRERELEASE=$PRE" >> "$GITHUB_ENV"
          PRE=$PRE yq -i '.annotations["artifacthub.io/prerelease"] = strenv(PRE)' charts/orbitgate/Chart.yaml
          # Changelog from Conventional Commits since the previous tag
          CHANGES="$(.github/changes.sh)" yq -i '.annotations["artifacthub.io/changes"] = strenv(CHANGES)' charts/orbitgate/Chart.yaml
          yq '.annotations["artifacthub.io/changes"]' charts/orbitgate/Chart.yaml
          # Chart README = repo README, with relative links/images made absolute so they work on artifacthub.io
          sed -E -e 's#\]\(([^h#)][^)]*)\)#](https://github.com/reflexglobal/orbitgate/blob/main/\1)#g' \
                 -e 's#src="([^h"][^"]*)"#src="https://raw.githubusercontent.com/reflexglobal/orbitgate/main/\1"#g' \
                 README.md > charts/orbitgate/README.md
      - name: Push chart
        run: |
          helm package charts/orbitgate --version "$VERSION" --app-version "$VERSION"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "orbitgate-$VERSION.tgz" oci://ghcr.io/reflexglobal/charts 2>&1 | tee push.log
          echo "CHART_DIGEST=$(awk '/^Digest:/{print $2}' push.log)" >> "$GITHUB_ENV"
      - name: Sign image and chart (ArtifactHub "Signed" badge)
        run: |
          cosign sign --yes "ghcr.io/reflexglobal/orbitgate@${{ steps.image.outputs.digest }}"
          cosign sign --yes "ghcr.io/reflexglobal/charts/orbitgate@$CHART_DIGEST"
      - name: ArtifactHub repository metadata (Verified publisher)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push ghcr.io/reflexglobal/charts/orbitgate:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            charts/orbitgate/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
      - name: GitHub release (chart tgz attached for airgapped transfer)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          # Conventional-commit changelog (same as ArtifactHub's) on top of GitHub's PR-based notes
          notes=$(yq -r '.annotations["artifacthub.io/changes"] | from_yaml | .[] | "- **" + .kind + "**: " + .description' charts/orbitgate/Chart.yaml)
          # Digests, so consumers (e.g. a platform release manifest) can pin exactly this build
          notes="$notes

          **Pin this release**
          - image \`ghcr.io/reflexglobal/orbitgate:$VERSION@$IMAGE_DIGEST\`
          - chart \`oci://ghcr.io/reflexglobal/charts/orbitgate\` version \`$VERSION\` (\`@$CHART_DIGEST\`)"
          gh release create "$GITHUB_REF_NAME" "orbitgate-$VERSION.tgz" --generate-notes --notes "$notes" --prerelease="$PRERELEASE"
